name: Build_alt
permissions:
  contents: write
on:
  workflow_dispatch:
    inputs:
      build_branch:
        description: Branch to build
        required: true
        default: android13-5.15-ksun_old

jobs: 
  build_kernel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false
      - name: Create Swap File
        run: |
          sudo dd if=/dev/zero of=/mnt/swapfile bs=1G count=12
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          echo "Memory status after swap:"
          free -h
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build Kernel
        run: |
          source ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          path: |
            build/*
          compression-level: 0

      - name: Gather build metadata
        id: meta
        run: |
          if [ -f out/include/config/kernel.release ]; then
            KERNEL_VERSION="$(cat out/include/config/kernel.release)"
          else
            KERNEL_VERSION="unknown"
          fi
      
          if [ -f out/ksu_version.txt ]; then
            KSU_VERSION="$(cat out/ksu_version.txt)"
          else
            KSU_VERSION="unknown"
          fi
      
          BUILD_DATE="$(date -u +'%Y-%m-%d %H:%M UTC')"
      
          {
            echo "kernel_version=$KERNEL_VERSION"
            echo "ksu_version=$KSU_VERSION"
            echo "build_date=$BUILD_DATE"
          } >> "$GITHUB_OUTPUT"
          
      - name: Publish
        id: release
        uses: softprops/action-gh-release@v2.4.2
        with:
          files: build/*
          name: KERNEL_${{ github.run_number }}
          tag_name: ${{ github.run_number }}
          
          body: |
            **DMXQ-KERNELSU-KERNEL**:
            **Thanks to @edgars-cirulis**
            WILL ONLY WORK ON ONEUI!!!! THIS IS NOT AOSP COMPATIBLE!!!! I AM NOT RESPONSIBLE FOR YOUR DEVICE NOT BOOTING/ BEING BRICKED, ANYTHING ELSE!
            
            - **KernelSU-Next included [KernelSU Next apk](https://github.com/KernelSU-Next/KernelSU-Next/releases)**
            - **Kernel Version:** ${{ steps.meta.outputs.kernel_version }}
            - **KSU Next Version:** ${{ steps.meta.outputs.ksu_version }}
            - **Build Date:** ${{ steps.meta.outputs.build_date }}
