name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        default: "prerelease"
        type: choice
        options:
          - release
          - prerelease
      ksu_ref:
        description: "KernelSU Next tag/branch"
        required: true
        default: "v3.1.0"

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
    permissions:
      contents: write

    env:
      CLANG_VERSION: clang-r584948
      CLANG_DIR: /home/runner/tools/google-clang
      CCACHE_DIR: /home/runner/.cache/ccache
      KSU_REF: ${{ github.event.inputs.ksu_ref }}

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
            tool-cache: true
            android: true
            dotnet: true
            haskell: true
            large-packages: true
            swap-storage: false  

      - name: Checkout kernel
        uses: actions/checkout@v4
        
      - name: Create Swap File
        run: |
          sudo dd if=/dev/zero of=/mnt/swapfile bs=1G count=12
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          echo "Memory status after swap:"
          free -h

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git bc bison build-essential curl flex \
            libssl-dev libelf-dev python3 rsync unzip zip cpio \
            device-tree-compiler ccache dwarves

      # -------------------------
      # CCACHE SETUP
      # -------------------------

      - name: Setup ccache
        run: |
          mkdir -p "$CCACHE_DIR"

          echo "max_size = 10.0G" > "$CCACHE_DIR/ccache.conf"

          echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"
          echo "CCACHE_COMPRESS=true" >> "$GITHUB_ENV"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ env.CLANG_VERSION }}-${{ hashFiles('scripts/build.sh', '**/Makefile', 'arch/arm64/configs/**') }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ env.CLANG_VERSION }}-
            ${{ runner.os }}-ccache-

      # -------------------------
      # CLANG CACHE
      # -------------------------

      - name: Cache clang toolchain
        uses: actions/cache@v4
        with:
          path: /home/runner/tools/google-clang
          key: ${{ runner.os }}-clang-${{ env.CLANG_VERSION }}

      # -------------------------
      # ANYKERNEL3
      # -------------------------

      - name: Clone AnyKernel3
        run: git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git

      - name: Replace AnyKernel3 with known-good dm1q template
        run: |
            cat > AnyKernel3/anykernel.sh <<'EOF'
            ### AnyKernel3 Ramdisk Mod Script
            ## osm0sis @ xda-developers
            
            ### AnyKernel setup
            # global properties
            properties() { '
            kernel.string=A kernel for S23 QCOM Series by edgarscirulis @ xda-developers
            do.devicecheck=0
            do.modules=0
            do.systemless=1
            do.cleanup=1
            do.cleanuponabort=0
            device.name1=
            device.name2=
            device.name3=
            device.name4=
            device.name5=
            supported.versions=
            supported.patchlevels=
            supported.vendorpatchlevels=
            '; } # end properties
            
            
            ### AnyKernel install
            ## boot files attributes
            boot_attributes() {
            set_perm_recursive 0 0 755 644 $ramdisk/*;
            set_perm_recursive 0 0 750 750 $ramdisk/init* $ramdisk/sbin;
            } # end attributes
            
            # boot shell variables
            block=/dev/block/bootdevice/by-name/boot;
            is_slot_device=0;
            ramdisk_compression=auto;
            patch_vbmeta_flag=auto;
            
            # import functions/variables and setup patching - see for reference (DO NOT REMOVE)
            . tools/ak3-core.sh;
            
            # boot install
            split_boot;
            
            flash_boot;


            EOF
      # -------------------------
      # BUILD
      # -------------------------

      - name: Make build script executable
        run: chmod +x scripts/build.sh

      - name: Build kernel
        run: |
          scripts/build.sh

      # -------------------------
      # COLLECT OUTPUT
      # -------------------------

      - name: Collect kernel outputs
        run: |
          mkdir -p release
      
          cp out/arch/arm64/boot/Image release/Image 2>/dev/null || true
          ls -lah release

      # -------------------------
      # PACKAGE ZIP
      # -------------------------

      - name: Package AnyKernel3 zip
        run: |
          cp release/Image AnyKernel3/Image
      
          ZIP_NAME="Kernel-dm1q-$(date -u +'%Y%m%d-%H%M').zip"
      
          (
            cd AnyKernel3
            zip -r9 "../$ZIP_NAME" . \
              -x "*.git*" \
              -x ".github/*"
          )
      
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

      # -------------------------
      # METADATA DETECTION
      # -------------------------

      - name: Gather build metadata
        id: meta
        run: |
          if [ -f out/include/config/kernel.release ]; then
            KERNEL_VERSION="$(cat out/include/config/kernel.release)"
          else
            KERNEL_VERSION="unknown"
          fi
      
          if [ -f out/ksu_version.txt ]; then
            KSU_VERSION="$(cat out/ksu_version.txt)"
          else
            KSU_VERSION="unknown"
          fi
      
          BUILD_DATE="$(date -u +'%Y-%m-%d %H:%M UTC')"
      
          {
            echo "kernel_version=$KERNEL_VERSION"
            echo "ksu_version=$KSU_VERSION"
            echo "build_date=$BUILD_DATE"
          } >> "$GITHUB_OUTPUT"

      # -------------------------
      # RELEASE NOTES
      # -------------------------

      - name: Generate release notes
        run: |
          cat > release_notes.md <<EOF
          Kernel Version: ${{ steps.meta.outputs.kernel_version }}
          KSU Next Version: ${{ steps.meta.outputs.ksu_version }}
          Build Date: ${{ steps.meta.outputs.build_date }}
          Credits: @edgars-cirulis
          EOF

      # -------------------------
      # RELEASE
      # -------------------------

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dm1q-${{ github.run_number }}
          name: dm1q Kernel Build
          prerelease: ${{ github.event.inputs.release_type == 'prerelease' }}
          body_path: release_notes.md
          files: |
            ${{ env.ZIP_NAME }}
