name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        default: "prerelease"
        type: choice
        options:
          - release
          - prerelease

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
    permissions:
      contents: write

    env:
      CLANG_VERSION: clang-r584948
      CLANG_DIR: /home/runner/tools/google-clang
      CCACHE_DIR: /home/runner/.cache/ccache

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
            tool-cache: true
            android: true
            dotnet: true
            haskell: true
            large-packages: true
            swap-storage: false  

      - name: Checkout kernel
        uses: actions/checkout@v4
        
      - name: Create Swap File
        run: |
          sudo dd if=/dev/zero of=/mnt/swapfile bs=1G count=12
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          echo "Memory status after swap:"
          free -h

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git bc bison build-essential curl flex \
            libssl-dev libelf-dev python3 rsync unzip zip cpio \
            device-tree-compiler ccache dwarves

      # -------------------------
      # CCACHE SETUP
      # -------------------------

      - name: Setup ccache
        run: |
          mkdir -p "$CCACHE_DIR"

          echo "max_size = 10.0G" > "$CCACHE_DIR/ccache.conf"

          echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"
          echo "CCACHE_COMPRESS=true" >> "$GITHUB_ENV"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ env.CLANG_VERSION }}-${{ hashFiles('scripts/build.sh', '**/Makefile', 'arch/arm64/configs/**') }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ env.CLANG_VERSION }}-
            ${{ runner.os }}-ccache-

      # -------------------------
      # CLANG CACHE
      # -------------------------

      - name: Cache clang toolchain
        uses: actions/cache@v4
        with:
          path: /home/runner/tools/google-clang
          key: ${{ runner.os }}-clang-${{ env.CLANG_VERSION }}

      # -------------------------
      # ANYKERNEL3
      # -------------------------

      - name: Clone and configure AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
      
          cd AnyKernel3
      
          # Set correct device names
          sed -i 's/device.name1=.*/device.name1=dm1q/' anykernel.sh

          sed -i 's|^BLOCK=.*|BLOCK=auto|' anykernel.sh
          sed -i 's/^IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=1/' anykernel.sh

          
          # Optional: nicer kernel name
          sed -i 's/kernel.string=.*/kernel.string=custom common kernel/' anykernel.sh
      
          cd ..
      # -------------------------
      # BUILD
      # -------------------------

      - name: Make build script executable
        run: chmod +x scripts/build.sh

      - name: Build kernel
        run: |
          scripts/build.sh

      # -------------------------
      # COLLECT OUTPUT
      # -------------------------

      - name: Collect kernel outputs
        run: |
          mkdir -p release

          cp out/arch/arm64/boot/Image* release/ 2>/dev/null || true
          cp out/arch/arm64/boot/dtb* release/ 2>/dev/null || true
          cp out/arch/arm64/boot/dtbo.img release/ 2>/dev/null || true

          ls -lah release

      # -------------------------
      # PACKAGE ZIP
      # -------------------------

      - name: Package AnyKernel3 zip
        run: |
          cp -r release/* AnyKernel3/ 2>/dev/null || true

          ZIP_NAME="Kernel-dm1q-$(date -u +'%Y%m%d-%H%M').zip"

          (
            cd AnyKernel3
            zip -r9 "../$ZIP_NAME" . \
              -x "*.git*" \
              -x ".github/*"
          )

          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

      # -------------------------
      # METADATA DETECTION
      # -------------------------

      - name: Gather build metadata
        id: meta
        run: |
      
          # Kernel Version
          if [ -f out/include/config/kernel.release ]; then
            KERNEL_VERSION="$(cat out/include/config/kernel.release)"
          else
            KERNEL_VERSION="unknown"
          fi
      
          # KernelSU Version 
          if [ -f build/ksu_version.txt ]; then
            KSU_VERSION="$(cat build/ksu_version.txt)"
          else
            KSU_VERSION="latest"
          fi
      
          BUILD_DATE="$(date -u +'%Y-%m-%d %H:%M UTC')"
      
          {
            echo "kernel_version=$KERNEL_VERSION"
            echo "ksu_version=$KSU_VERSION"
            echo "build_date=$BUILD_DATE"
          } >> "$GITHUB_OUTPUT"

      # -------------------------
      # RELEASE NOTES
      # -------------------------

      - name: Generate release notes
        run: |
          cat > release_notes.md <<EOF
          Kernel Version: ${{ steps.meta.outputs.kernel_version }}
          KSU Next Version: ${{ steps.meta.outputs.ksu_version }}
          Build Date: ${{ steps.meta.outputs.build_date }}
          Credits: @edgars-cirulis
          EOF

      # -------------------------
      # RELEASE
      # -------------------------

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dm1q-${{ github.run_number }}
          name: dm1q Kernel Build
          prerelease: ${{ github.event.inputs.release_type == 'prerelease' }}
          body_path: release_notes.md
          files: |
            ${{ env.ZIP_NAME }}
